services:
  postgres:
    image: postgres:16-alpine
    container_name: certificate_generator_db
    environment:
      POSTGRES_DB: certificate_generator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d certificate_generator"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
